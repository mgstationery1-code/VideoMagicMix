name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Build standalone backend and installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Target nsis
      - name: Export clean source
        run: ./.venv/Scripts/python.exe scripts/export_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: VideoMagicMix-Windows-x64
          path: |
            dist/*Setup*.exe
            dist/*.sha256
            dist/*Source*.zip
