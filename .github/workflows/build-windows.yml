name: Build Windows installer
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and upload; leave empty for artifacts only'
        required: false
        type: string
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install desktop dependencies
        run: npm ci
      - name: Build standalone backend and installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Target nsis
      - name: Export clean source
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe scripts/export_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Source export failed.' }
          Get-ChildItem dist -File -Filter '*Source*.zip' | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath ($_.FullName + '.sha256') -Value ($digest + '  ' + $_.Name) -Encoding ASCII
          }
      - uses: actions/upload-artifact@v4
        with:
          name: VideoMagicMix-Windows-x64
          path: |
            dist/*Setup*.exe
            dist/*.sha256
            dist/*Source*.zip
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoMagicMix-Windows-x64
          path: dist
      - name: Upload verified files to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/*Setup*.exe dist/*.sha256 dist/*Source*.zip
